<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#E8463A"/>
    </marker>
    <style>
      .title { font: 600 24px "PingFang SC", sans-serif; fill: #171717; }
      .subtitle { font: 400 14px "PingFang SC", sans-serif; fill: #52525B; }
      .label { font: 500 16px "PingFang SC", sans-serif; fill: #171717; }
      .small { font: 400 13px "PingFang SC", sans-serif; fill: #52525B; }
      .wall { fill: #F7F7F8; stroke: #52525B; stroke-width: 3; }
      .room { fill: #FFFFFF; stroke: #B8BAC2; stroke-width: 2; }
      .service { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 2; }
      .danger { fill: #FFF4F1; stroke: #E8463A; stroke-width: 2; }
      .blocked { stroke: #E8463A; stroke-width: 7; stroke-linecap: round; }
      .route { fill: none; stroke: #4B3FE3; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .beast { fill: none; stroke: #E8463A; stroke-width: 5; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
      .thin { fill: none; stroke: #8A8D98; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#FFFFFF"/>
  <text x="50" y="45" class="title">第一章：粮油超市空间结构</text>
  <text x="50" y="70" class="subtitle">一层为主要行动区；二层未搜索，通过内部楼梯连接</text>

  <text x="50" y="110" class="label">一层平面</text>
  <rect x="50" y="130" width="770" height="600" rx="8" class="wall"/>

  <rect x="50" y="130" width="220" height="170" class="danger"/>
  <text x="125" y="205" class="label">卸货区</text>
  <text x="95" y="230" class="small">凶兽预先封锁于此</text>

  <rect x="270" y="130" width="350" height="170" class="room"/>
  <text x="415" y="200" class="label">后仓</text>
  <text x="345" y="225" class="small">大米、食盐、桶装油、板车</text>

  <rect x="620" y="130" width="200" height="170" class="service"/>
  <text x="685" y="200" class="label">冷库</text>
  <text x="645" y="225" class="small">保温板后接消防梯</text>

  <rect x="50" y="300" width="110" height="430" class="service"/>
  <text x="78" y="455" class="label">西侧</text>
  <text x="70" y="480" class="label">消防通道</text>
  <text x="76" y="510" class="small">已被堵塞</text>
  <line x1="68" y1="545" x2="142" y2="585" class="blocked"/>
  <line x1="142" y1="545" x2="68" y2="585" class="blocked"/>

  <rect x="160" y="300" width="500" height="430" class="room"/>
  <text x="370" y="355" class="label">一层卖场</text>
  <g class="thin">
    <rect x="205" y="395" width="170" height="35"/>
    <rect x="440" y="395" width="170" height="35"/>
    <rect x="205" y="475" width="170" height="35"/>
    <rect x="440" y="475" width="170" height="35"/>
    <rect x="205" y="555" width="170" height="35"/>
    <rect x="440" y="555" width="170" height="35"/>
  </g>
  <text x="345" y="640" class="small">倾倒货架形成狭窄通路</text>

  <rect x="660" y="300" width="160" height="430" class="service"/>
  <text x="700" y="445" class="label">东侧</text>
  <text x="686" y="470" class="label">员工通道</text>
  <text x="680" y="500" class="small">通往冷库与后巷</text>

  <rect x="50" y="96" width="220" height="34" class="danger"/>
  <text x="92" y="119" class="small">北侧货车坡道入口</text>
  <line x1="270" y1="140" x2="270" y2="290" stroke="#E8463A" stroke-width="6" stroke-dasharray="12 8"/>
  <text x="282" y="158" class="small">隔离卷帘门</text>

  <rect x="330" y="730" width="200" height="35" class="service"/>
  <text x="390" y="754" class="small">南侧正门</text>

  <rect x="820" y="600" width="80" height="45" class="service"/>
  <text x="830" y="628" class="small">后巷出口</text>

  <path d="M430 780 L430 685 L410 610 L410 335 L455 270" class="route"/>
  <path d="M455 270 L650 270 L680 320 L760 320 L760 270 L800 270 L800 600 L850 600" class="route"/>
  <text x="470" y="690" class="small" fill="#4B3FE3">搜索队进入</text>
  <text x="665" y="350" class="small" fill="#4B3FE3">小文逃生</text>

  <path d="M160 90 L160 180 L310 215 L410 330 L410 455" class="beast"/>

  <text x="880" y="110" class="label">二层平面</text>
  <rect x="870" y="130" width="280" height="300" rx="8" class="wall"/>
  <rect x="890" y="155" width="110" height="105" class="room"/>
  <text x="920" y="215" class="label">办公室</text>
  <rect x="1020" y="155" width="110" height="105" class="room"/>
  <text x="1038" y="215" class="label">员工休息室</text>
  <rect x="890" y="280" width="150" height="125" class="room"/>
  <text x="925" y="348" class="label">设备间</text>
  <rect x="1060" y="280" width="70" height="125" class="service"/>
  <text x="1078" y="330" class="label">楼梯</text>
  <text x="1068" y="355" class="small">下一层</text>
  <text x="913" y="458" class="subtitle">二层未进入，不参与第一章行动</text>

  <rect x="870" y="510" width="280" height="180" rx="8" fill="#F7F7F8" stroke="#B8BAC2" stroke-width="2"/>
  <text x="894" y="545" class="label">路线图例</text>
  <line x1="895" y1="580" x2="965" y2="580" class="route"/>
  <text x="985" y="585" class="small">搜索与逃生路线</text>
  <line x1="895" y1="625" x2="965" y2="625" class="beast"/>
  <text x="985" y="630" class="small">凶兽进入路线</text>
  <line x1="895" y1="660" x2="945" y2="680" class="blocked"/>
  <text x="985" y="677" class="small">堵塞位置</text>
</svg>
