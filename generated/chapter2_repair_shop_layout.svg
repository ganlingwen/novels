<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#E8463A"/>
    </marker>
    <style>
      .title { font: 600 24px "PingFang SC", sans-serif; fill: #171717; }
      .subtitle { font: 400 14px "PingFang SC", sans-serif; fill: #52525B; }
      .label { font: 500 16px "PingFang SC", sans-serif; fill: #171717; }
      .small { font: 400 13px "PingFang SC", sans-serif; fill: #52525B; }
      .wall { fill: #F7F7F8; stroke: #52525B; stroke-width: 3; }
      .area { fill: #FFFFFF; stroke: #B8BAC2; stroke-width: 2; }
      .focus { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 2; }
      .danger { fill: #FFF4F1; stroke: #E8463A; stroke-width: 2; }
      .route { fill: none; stroke: #4B3FE3; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .cat { fill: none; stroke: #E8463A; stroke-width: 5; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
      .canopy { fill: #F2F7FF; fill-opacity: .55; stroke: #4B3FE3; stroke-width: 2; stroke-dasharray: 10 7; }
      .leader { fill: none; stroke: #8A8D98; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#FFFFFF"/>
  <text x="50" y="45" class="title">第二章：永顺汽修厂伏击区</text>
  <text x="50" y="70" class="subtitle">俯视图；北侧为院子深处，南侧临街</text>

  <rect x="50" y="100" width="820" height="640" rx="8" class="wall"/>

  <rect x="50" y="100" width="370" height="640" class="area"/>
  <text x="185" y="140" class="label">西侧维修区</text>

  <g class="focus">
    <circle cx="130" cy="230" r="48"/>
    <circle cx="200" cy="230" r="48"/>
    <circle cx="165" cy="300" r="48"/>
  </g>
  <text x="118" y="370" class="label">轮胎堆</text>

  <rect x="235" y="460" width="145" height="180" rx="8" class="focus"/>
  <text x="275" y="545" class="label">检修坑</text>

  <rect x="420" y="100" width="450" height="640" class="area"/>
  <text x="585" y="710" class="label">东侧狭窄车道</text>

  <rect x="450" y="125" width="350" height="515" rx="8" class="canopy"/>
  <text x="555" y="155" class="label">铁皮雨棚覆盖区</text>
  <text x="485" y="180" class="small">西边固定于维修间外墙，东边由两根钢柱支撑</text>

  <rect x="455" y="220" width="76" height="160" rx="8" class="area"/>
  <text x="467" y="285" class="label">工具架</text>
  <text x="464" y="312" class="small">原放钢钎</text>

  <circle cx="790" cy="225" r="15" class="danger"/>
  <rect x="740" y="260" width="82" height="56" rx="8" class="danger"/>
  <text x="753" y="293" class="small">立式千斤顶</text>

  <circle cx="790" cy="600" r="15" class="focus"/>
  <text x="690" y="608" class="small">完好前支柱</text>

  <path d="M842 330 C815 350 848 375 820 405 C850 435 820 460 848 490" fill="none" stroke="#27A36A" stroke-width="7" stroke-linecap="round"/>
  <text x="800" y="520" class="small">墙缝枯藤</text>

  <rect x="560" y="205" width="100" height="60" rx="8" class="danger"/>
  <text x="586" y="233" class="label">血布</text>
  <text x="572" y="255" class="small">绑在旧轮胎</text>

  <path d="M790 225 C725 260 700 310 670 365" fill="none" stroke="#8A8D98" stroke-width="4"/>
  <text x="520" y="390" class="small">拖车钢索预套柱脚</text>
  <line x1="710" y1="430" x2="780" y2="350" stroke="#4B3FE3" stroke-width="7" stroke-linecap="round"/>
  <text x="500" y="450" class="small">钢钎预放在后支柱内侧</text>

  <rect x="520" y="740" width="220" height="38" rx="8" class="focus"/>
  <text x="594" y="765" class="small">南侧大门</text>

  <path d="M660 805 L660 690 L700 620 L700 500 L700 340 L610 270" class="cat"/>

  <path d="M610 805 L610 690 L625 620 L690 560 L760 500" class="route"/>

  <rect x="900" y="120" width="250" height="360" rx="8" fill="#F7F7F8" stroke="#B8BAC2" stroke-width="2"/>
  <text x="925" y="160" class="label">坍塌逻辑</text>
  <text x="925" y="205" class="small">1. 千斤顶承担部分重量</text>
  <text x="925" y="245" class="small">2. 泄压阀锈死，机关失败</text>
  <text x="925" y="285" class="small">3. 藤蔓缠住凶猫后腿</text>
  <text x="925" y="325" class="small">4. 凶猫撞击红圈后支柱</text>
  <text x="925" y="365" class="small">5. 小文拉动钢索折断柱脚</text>
  <text x="925" y="405" class="small">6. 半边雨棚砸入窄车道</text>
  <text x="925" y="445" class="small">7. 小文从后支柱内侧取钢钎</text>

  <rect x="900" y="520" width="250" height="170" rx="8" fill="#F7F7F8" stroke="#B8BAC2" stroke-width="2"/>
  <text x="925" y="558" class="label">路线图例</text>
  <line x1="925" y1="595" x2="990" y2="595" class="route"/>
  <text x="1015" y="601" class="small">小文移动</text>
  <line x1="925" y1="640" x2="990" y2="640" class="cat"/>
  <text x="1015" y="646" class="small">凶猫追击</text>
</svg>
