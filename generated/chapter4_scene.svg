<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7Z" fill="#C43D35"/></marker>
    <marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7Z" fill="#3457D5"/></marker>
    <style>
      text { font-family: "PingFang SC", sans-serif; fill: #171717; }
      .title { font-size: 24px; font-weight: 600; }
      .label { font-size: 17px; font-weight: 500; }
      .small { font-size: 14px; fill: #52525B; }
      .route { fill: none; stroke: #3457D5; stroke-width: 3; marker-end: url(#blue); }
      .attack { fill: none; stroke: #C43D35; stroke-width: 3; marker-end: url(#red); }
      .root { fill: none; stroke: #3E8B62; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="820" fill="white"/>
  <text x="45" y="42" class="title">第四章：西墙涵管防线</text>
  <text x="45" y="70" class="small">上北下南，左西右东；示意图不按比例。墙头与墙下分别取景。</text>
  <rect x="45" y="100" width="385" height="545" fill="#F3F4F6" stroke="#B8BAC2"/>
  <rect x="480" y="100" width="675" height="545" fill="#F2F8F4" stroke="#6C9875"/>
  <text x="65" y="130" class="label">墙外西区</text>
  <text x="1040" y="130" class="label">猎鹰墙内</text>
  <rect x="85" y="155" width="280" height="75" rx="5" fill="#E5E7EB" stroke="#737780"/>
  <text x="115" y="185" class="label">西环高架：封衢</text>
  <text x="105" y="212" class="small">在护栏旁向墙上的马克伸出五指</text>
  <rect x="80" y="270" width="235" height="75" rx="5" fill="#FFF0E8" stroke="#C86632"/>
  <text x="115" y="302" class="label">西北侧化工仓</text>
  <text x="100" y="328" class="small">外来搜索队纵火；黑烟升起</text>
  <path d="M330 245 C390 310 370 410 428 460" class="attack"/>
  <text x="72" y="389" class="label">约210只丧尸转向涵管</text>
  <text x="72" y="415" class="small">尸群退去后，木闸仍未打开</text>
  <rect x="430" y="100" width="50" height="545" fill="#D7D9DE" stroke="#52525B" stroke-width="2"/>
  <text x="431" y="135" class="label">西墙</text>
  <text x="488" y="160" class="small">墙头：马克、天干、弩手</text>
  <rect x="520" y="200" width="235" height="140" rx="5" fill="#E7F3E5" stroke="#6C9875"/>
  <text x="555" y="231" class="label">V 菜地</text>
  <text x="540" y="259" class="small">小文清枯秧、解旧绳</text>
  <text x="540" y="285" class="small">老杜修架、劈木楔</text>
  <text x="540" y="312" class="small">木箱留在菜地</text>
  <rect x="395" y="435" width="100" height="65" rx="12" fill="#E9F7FB" stroke="#29869A" stroke-width="2"/>
  <text x="160" y="482" class="label">U 涵管，口径约1.2米</text>
  <line x1="495" y1="433" x2="495" y2="502" stroke="#8C5E3C" stroke-width="8"/>
  <text x="515" y="398" class="label">G 双扇木闸</text>
  <text x="515" y="423" class="small">门闩＋槽内横木＋根网</text>
  <path d="M510 442 Q537 467 510 493 M510 442 Q487 465 510 493" class="root"/>
  <circle cx="550" cy="466" r="13" fill="#3E8B62"/>
  <circle cx="590" cy="466" r="13" fill="#B7791F"/>
  <text x="528" y="509" class="small">小文</text>
  <text x="580" y="509" class="small">老杜在其身后</text>
  <text x="520" y="538" class="small">断木向墙内折出；老杜后倒拖开小文</text>
  <rect x="430" y="563" width="50" height="58" fill="#FFF7E8" stroke="#B7791F" stroke-width="2"/>
  <text x="295" y="595" class="label">D 西墙正门</text>
  <line x1="805" y1="100" x2="805" y2="398" stroke="#8A8D94" stroke-width="12"/>
  <line x1="805" y1="475" x2="805" y2="645" stroke="#8A8D94" stroke-width="12"/>
  <text x="780" y="185" class="label">I 内墙</text>
  <text x="825" y="398" class="label">M 内墙门</text>
  <path d="M645 348 Q704 352 773 410 L799 435" class="route"/>
  <text x="636" y="375" class="small">清理组撤离</text>
  <path d="M647 458 L795 458 L857 487" class="route"/>
  <rect x="860" y="455" width="265" height="85" rx="5" fill="#EEF4FF" stroke="#5672C8"/>
  <text x="895" y="484" class="label">救治线</text>
  <text x="878" y="510" class="small">保留断木转运，到此才取出</text>
  <text x="878" y="531" class="small">白川救治；天干批准改变次序</text>
  <path d="M816 429 L1137 429 L1137 600 L1117 600" class="route"/>
  <rect x="890" y="570" width="225" height="60" rx="5" fill="#FFF7E8" stroke="#B7791F"/>
  <text x="906" y="605" class="label">T 体育馆地下入口</text>
  <rect x="45" y="675" width="1110" height="112" rx="6" fill="#F7F7F8" stroke="#B8BAC2"/>
  <text x="65" y="704" class="label">加固与失守顺序</text>
  <text x="240" y="704" class="small">左端入槽 → 削短右端 → 根网兜回门板 → 右端入槽、木楔塞紧 → 横木断裂 → 根网苦撑</text>
  <text x="65" y="737" class="label">止血与转运顺序</text>
  <text x="240" y="737" class="small">衣摆、剩余木楔隔布加压＋活根导引 → 白川固定木茬 → 担架穿内墙门 → 取木茬、封血</text>
  <text x="65" y="768" class="small">小文留在墙下，不能隔着木闸看见高架上的手势；他听见撞击先停，随后才有人呼喊马克。</text>
</svg>
